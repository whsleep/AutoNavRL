world:
  height: 20  # the height of the world
  width: 20  # the height of the world
  step_time: 0.1  # 10Hz calculate each step
  sample_time: 0.1  # 10 Hz for render and data extraction
  collision_mode: 'reactive'
  obstacle_map: 'museum.png'

robot:
  - kinematics: {name: 'diff'} # 全向模型
    shape: {name: 'circle', radius: 0.18}
    vel_min: [-1, -1]
    vel_max: [1, 1]
    state: [10, 10, 0, 0]
    goal: [9, 9, 0]
    arrive_mode: state
    goal_threshold: 0.2

    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 6.28
        number: 720
        noise: True
        std: 0.05
        angle_std: 0.05
        offset: [ 0.0, 0, 0 ]
        alpha: 0.3

    plot:
      show_trajectory: True

obstacle:
  - number: 15
    kinematics: {name: 'omni'}
    distribution: {name: 'random', range_low: [0, 0, -3.14], range_high: [19, 19, 3.14]}
    behavior: {name: 'rvo', wander: True, range_low: [0, 0, -3.14], range_high: [6, 6, 3.14], vxmax: 0.5, vymax: 0.5, factor: 1.0}
    vel_max: [0.5, 0.5]
    vel_min: [-0.5, -0.5]
    shape:
      - {name: 'circle', radius: 0.25, random_shape: False}
      - {name: 'polygon', random_shape: true, avg_radius_range: [0.3, 0.5], irregularity_range: [0, 0.2], spikeyness_range: [0, 0.2], num_vertices_range: [4, 6]}